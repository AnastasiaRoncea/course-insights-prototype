<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Insights – MVP Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#323ED0; --blue-600:#2833B4; --blue-50:#EEF0FF; --blue-100:#DADDFB;
  --yellow:#FFB900; --yellow-50:#FFF6DB; --peach:#FCDAB0;
  --ink:#14142B; --ink-2:#3A3A55; --muted:#6B6B80; --line:#E5E5EE; --bg:#F6F6FA; --card:#FFFFFF;
  --green:#127A4B; --green-50:#E5F5EC; --red:#C23434; --red-50:#FCEBEB; --amber:#9A5B00; --amber-50:#FFF2DC;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,43,.06),0 4px 16px rgba(20,20,43,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Red Hat Display",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* layout */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--ink) 232px,var(--bg) 232px)}
.side{background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:13px}
.brand span{font-size:12px;color:#B9B9D0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav .off{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#D8D8EA;font-weight:500}
.nav a:hover{background:#24243F;text-decoration:none}
.nav a.on{background:#2B2B4A;color:#fff}
.nav .count{margin-left:auto;background:var(--yellow);color:var(--ink);border-radius:20px;font-size:11px;font-weight:700;padding:1px 7px}
.nav .off{color:#7D7D98;cursor:not-allowed}
.nav .off em{margin-left:auto;font-style:normal;font-size:10px;border:1px solid #4A4A66;border-radius:20px;padding:1px 6px}
.side-foot{margin-top:auto;font-size:11.5px;color:#9C9CB8;padding:0 6px;line-height:1.5}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-right:6px}
main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.proto-tag{font-size:12px;color:var(--amber);background:var(--amber-50);border:1px solid #F3D9A6;padding:4px 10px;border-radius:20px;font-weight:600}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-weight:700;font-size:13px}
.user b{display:block;font-size:13px}
.user span{font-size:12px;color:var(--muted)}
.page{padding:26px 32px 120px;max-width:1180px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.35fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#C9C9D9;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-600)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled],.btn.disabled{background:#EDEDF3;border-color:#E2E2EA;color:#9A9AAE;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,tr:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue-100);outline-offset:1px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.red{background:var(--red-50);color:var(--red)}
.pill.green{background:var(--green-50);color:var(--green)}
.pill.amber{background:var(--amber-50);color:var(--amber)}
.pill.blue{background:var(--blue-50);color:var(--blue)}
.pill.gray{background:#EEEEF3;color:var(--ink-2)}
.tag{font-size:12px;color:var(--ink-2);background:#EEEEF3;border-radius:6px;padding:3px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.callout{display:flex;gap:14px;align-items:flex-start;border-radius:var(--radius);padding:16px 18px;border:1px solid}
.callout .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.callout.attn{background:var(--red-50);border-color:#F3C9C9}
.callout.attn .ic{background:#F8D5D5;color:var(--red)}
.callout.warn{background:var(--amber-50);border-color:#F3D9A6}
.callout.warn .ic{background:#FBE2B6;color:var(--amber)}
.callout.good{background:var(--green-50);border-color:#BFE6D0}
.callout.good .ic{background:#C9EDD8;color:var(--green)}
.callout.info{background:var(--yellow-50);border-color:#F6E2A6}
.callout.info .ic{background:var(--yellow);color:var(--ink)}
.callout.lock{background:#F1F1F6;border-color:#DCDCE6}
.callout.lock .ic{background:#E1E1EA;color:var(--ink-2)}
.callout .body{flex:1;min-width:0}
.callout .body p{margin-top:3px;color:var(--ink-2)}
.callout .act{margin-left:auto;align-self:center}

/* kpis */
.kpi{padding:16px 18px}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi .sub.good{color:var(--green);font-weight:600}
.kpi .sub.bad{color:var(--red);font-weight:600}

/* table */
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#FAFAFD}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ctitle{font-weight:700}
.ctitle small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.ctitle .pill{margin-top:5px}
.score{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:8px;font-weight:800;font-size:14px}
.score.lo{background:var(--red-50);color:var(--red)}
.score.mid{background:var(--amber-50);color:var(--amber)}
.score.hi{background:var(--green-50);color:var(--green)}
.foot-note{font-size:12px;color:var(--muted);margin-top:12px;display:flex;gap:6px;align-items:center}

/* course detail */
.impact-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.impact-big{width:86px;height:86px;border-radius:20px;display:grid;place-items:center;font-size:34px;font-weight:800}
.breakdown{display:flex;gap:22px;flex-wrap:wrap}
.breakdown div b{display:block;font-size:18px}
.breakdown div span{font-size:12px;color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:grid;grid-template-columns:190px 1fr 64px;gap:12px;align-items:center}
.fstep .lab{font-size:13px;font-weight:600}
.fstep .lab small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.fbar{height:26px;background:#F0F0F6;border-radius:7px;position:relative;overflow:hidden}
.fbar span{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:7px}
.fstep.drop .fbar span{background:var(--red)}
.fstep .n{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.drop-tag{font-size:11.5px;color:var(--red);font-weight:700;margin:-4px 0 0 202px}
.reasons{display:flex;flex-direction:column;gap:9px}
.reason{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.reason .rb{height:10px;background:#F0F0F6;border-radius:6px;overflow:hidden}
.reason .rb span{display:block;height:100%;background:var(--yellow);border-radius:6px}
.reason .pc{text-align:right;font-weight:700}

/* wizard */
.stepper{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted)}
.step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#EEEEF3;font-size:12px;font-weight:700}
.step.on{border-color:var(--blue);color:var(--ink)}
.step.on .dot{background:var(--blue);color:#fff}
.step.done{color:var(--ink)}
.step.done .dot{background:var(--green);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],textarea,select{font-family:inherit;font-size:14px;border:1px solid #D6D6E2;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:62px}
.field.err input,.field.err textarea{border-color:var(--red);background:#FFFBFB}
.errmsg{color:var(--red);font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.hyp{background:var(--blue-50);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.6}
.hyp b{color:var(--blue)}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;margin-bottom:10px;background:#fff}
.opt:hover{border-color:#C9C9D9}
.opt.sel{border-color:var(--blue);background:#FAFAFF}
.opt.dis{cursor:not-allowed;background:#F7F7FA;color:var(--muted)}
.opt input{margin-top:3px;accent-color:var(--blue)}
.opt .t{font-weight:700}
.opt .d{font-size:13px;color:var(--muted);margin-top:2px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.abcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#FBFBFD}
.abcard .k{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.abcard .t{font-weight:700;margin-top:4px}
.client{display:grid;grid-template-columns:24px 1fr auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.client input{width:18px;height:18px;accent-color:var(--blue)}
.client.out{color:var(--muted)}
.estimate{border-radius:12px;padding:14px 16px;margin-top:14px;border:1px solid var(--line);background:#FBFBFD}
.estimate .row2{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
.estimate .row2 b{display:block;font-size:20px}
.estimate .row2 span{font-size:12px;color:var(--muted)}
.summary{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;font-size:14px}
.summary dt{color:var(--muted);font-weight:600}
.summary dd{margin:0}

/* results */
.timebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px dashed #C9C9DA;border-radius:12px;padding:10px 14px;margin-bottom:16px;background:#fff}
.timebar .lbl{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-weight:600;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.progress{height:10px;background:#EEEEF3;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.progress span{display:block;height:100%;background:var(--blue);border-radius:6px}
.rbars{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.rb-row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center}
.rb-row .nm{font-weight:700;font-size:13px}
.rb-row .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.rtrack{height:30px;background:#F0F0F6;border-radius:8px;position:relative}
.rtrack .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.rtrack .ci{position:absolute;top:50%;height:2px;background:var(--ink);transform:translateY(-50%)}
.rtrack .ci::before,.rtrack .ci::after{content:"";position:absolute;top:-6px;width:2px;height:14px;background:var(--ink)}
.rtrack .ci::before{left:0}.rtrack .ci::after{right:0}
.rb-row .v{font-weight:800;font-size:17px;text-align:right}
.faded .fill{opacity:.45}
.guard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:#FBFBFD;border:1px solid var(--line);margin-top:16px;flex-wrap:wrap}
.decision{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .big{width:56px;height:56px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px}
.empty .big svg.i{width:24px;height:24px}
.kv{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.kv div span{display:block;font-size:12px;color:var(--muted);font-weight:600}

/* guide */
.guide{position:fixed;right:0;top:0;bottom:0;width:320px;overflow:auto;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(20,20,43,.08);z-index:30;padding:20px 20px 16px}
.layout.with-guide{padding-right:320px}
@media (max-width:1100px){.layout.with-guide{padding-right:0}.guide{top:auto;left:auto;right:16px;bottom:16px;width:360px;max-height:calc(100vh - 32px);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(20,20,43,.2)}}
.guide h3{display:flex;align-items:center;gap:8px}
.guide .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);padding:4px}
.guide ol,.guide ul{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--ink-2)}
.guide li{margin-bottom:6px}
.guide .sec{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:14px;text-transform:uppercase}
.guide .gbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fab{position:fixed;right:20px;bottom:20px;z-index:29;box-shadow:0 8px 24px rgba(20,20,43,.2)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,20,43,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:18px;margin-bottom:6px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.lp{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.lp-top{background:var(--ink);color:#fff;padding:10px 14px;font-size:12.5px;display:flex;justify-content:space-between;gap:10px}
.lp-body{padding:20px;text-align:center}
.lp-check{width:44px;height:44px;border-radius:50%;background:var(--green-50);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}
.faces{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.faces button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
.faces button.on{background:var(--yellow);border-color:var(--yellow)}
.scale-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);max-width:250px;margin:0 auto}
.lp-chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.lp-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.lp-note{font-size:12px;color:var(--muted);margin-top:12px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#F0F0F6;padding:1px 5px;border-radius:5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;display:flex;gap:8px;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1000px){
  .g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;background:var(--bg)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav .off,.side-foot,.brand span{display:none}
  .top{padding:10px 16px;position:static}
  .user div{display:none}
  .page{padding:18px 16px 120px}
  .fstep{grid-template-columns:120px 1fr 48px}
  .drop-tag{margin-left:132px}
  .rb-row{grid-template-columns:96px 1fr 56px}
  .ab{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr}
  .guide{left:12px;right:12px;width:auto;bottom:12px}
  .reason{grid-template-columns:100px 1fr 36px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- icons ---------- */
const ICONS={
  chart:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  flask:'<path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.5a1 1 0 0 0 .9 1.5h12.8a1 1 0 0 0 .9-1.5l-5.1-10.1a2 2 0 0 1-.2-.9V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',

function spark(vals){
  const w=84,h=26,min=Math.min(...vals)-2,max=Math.max(...vals)+2;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-min)/(max-min))*h}`).join(' ');
  const down=vals[vals.length-1]<vals[0]-2, up=vals[vals.length-1]>vals[0]+2;
  const col=down?'#C23434':up?'#127A4B':'#8A8AA0';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="8-week trend"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function funnelFor(c){
  if(c.id==='storytelling') return [
    {l:'Enrolled',s:'',n:1240},{l:'Started',s:'',n:1050},
    {l:'Finished Module 1',s:'Why stories beat charts · 14-min video',n:546},
    {l:'Finished Module 2',s:'Structuring your narrative',n:490},
    {l:'Finished Module 3',s:'Visual choices',n:452},
    {l:'Passed final quiz',s:'',n:434}];
  const L=c.learners, st=Math.round(L*Math.max(.9,Math.min(.99,(c.completion+3)/100))), fin=Math.round(L*c.completion/100), gap=Math.max(st-fin,0);
  const w=[.45,.25,.3];
  let cur=st; const out=[{l:'Enrolled',s:'',n:L},{l:'Started',s:'',n:st}];
  w.forEach((x,i)=>{cur=Math.round(cur-gap*x); out.push({l:i<2?`Finished Module ${i+1}`:'Passed final quiz',s:'',n:i<2?cur:fin});});
  return out;
}
function reasonsFor(c){
  if(c.id==='storytelling') return [['Too long',46],['Very useful',27],['Not relevant to my job',18],['Too basic',9]];
  const g=Math.round((c.rating-2.5)/2.5*70)+10;

}

/* ---------- wizard ---------- */
function newDraft(courseId,kind){
  const story=courseId==='storytelling';
  const base={courseId,kind,step:1,errors:{},clients:{acme:true,carpathia:true,helix:true}};
  if(kind==='delivery') return {...base,change:'send the course reminder on Thursday afternoon instead of Monday morning',why:'Monday inboxes are full, and most learners open reminders later in the week',metric:'deadline',guardrail:'unsub',variant:'thu'};
  return {...base,
    change: story?'split the 14-min Module 1 video into 3 videos of about 5 minutes':'shorten the module where most learners stop',
    why: story?'most learners leave the Module 1 video after about 6 minutes':'that is where the biggest drop-off happens',
    metric:'m1',guardrail:'quiz',variant:'v2'};
}
function estimate(d){
  const c=course(d.courseId);
  const sel=CLIENTS.filter(k=>k.optIn&&d.clients[k.id]);
  const learners=sel.reduce((a,k)=>a+Math.round(c.learners*k.share),0);
  const days=learners?Math.max(MIN_DAYS,Math.ceil(REQUIRED/(learners*DAILY))):0;
  return {sel,learners,days,perDay:Math.round(learners*DAILY)};
}
function validate(d){
  const e={};
  if(d.step===1){
    if(!d.change.trim()) e.change='Describe the change you want to test.';
    if(!d.why.trim()) e.why='Add the reason you think it will work. It helps everyone learn from the result.';
  }
  if(d.step===3 && !estimate(d).sel.length) e.clients='Select at least one client. Only clients who opted in to experiments can be included.';
  return e;
}
function viewNew(courseId,kind){
  const c=course(courseId); if(!c) return notFound();
  if(isCompliance(c)&&kind!=='delivery') kind='delivery';
  if(!S.draft||S.draft.courseId!==courseId||S.draft.kind!==kind) S.draft=newDraft(courseId,kind);
  const d=S.draft, steps=['Hypothesis','Variant','Audience','Review'];
  const metricOpts=kind==='delivery'?['deadline']:['m1','completion','quiz','rating'];
  const guardOpts=kind==='delivery'?['unsub']:['quiz','rating','completion'].filter(g=>g!==d.metric);
  if(!guardOpts.includes(d.guardrail)) d.guardrail=guardOpts[0];
  const vars=VARIANTS[kind], v=vars.find(x=>x.id===d.variant)||vars[0];
  const controlName=kind==='delivery'?'Current: Monday at 09:00':'v1 · Current course';
  const est=estimate(d);
  let body='';
  if(d.step===1){
    body=`<h2 style="margin-bottom:4px">What do you want to learn?</h2><p class="muted" style="margin-bottom:16px">Every idea starts as a hypothesis, so the result teaches us something even if it loses.</p>
    <div class="field ${d.errors.change?'err':''}"><label for="f-change">If we…</label>
      <input type="text" id="f-change" data-field="change" value="${esc(d.change)}" placeholder="e.g. split the long video into shorter ones">
      ${d.errors.change?`<div class="errmsg">${ic('warn',14)} ${d.errors.change}</div>`:''}</div>
    <div class="field"><label for="f-metric">…then this metric will improve</label>
      <select id="f-metric" data-field="metric">${metricOpts.map(m=>`<option value="${m}" ${d.metric===m?'selected':''}>${METRICS[m].label}</option>`).join('')}</select></div>
    <div class="field ${d.errors.why?'err':''}"><label for="f-why">…because</label>
      <textarea id="f-why" data-field="why" placeholder="What makes you think so?">${esc(d.why)}</textarea>
      ${d.errors.why?`<div class="errmsg">${ic('warn',14)} ${d.errors.why}</div>`:''}</div>
    <div class="field"><label for="f-guard">Guardrail: this must not get worse</label>
      <select id="f-guard" data-field="guardrail">${guardOpts.map(m=>`<option value="${m}" ${d.guardrail===m?'selected':''}>${GUARDS[m].label}</option>`).join('')}</select>
      <span class="hint">Protects us from “wins” that hurt learning, e.g. higher completion but lower quiz scores.</span></div>`;
  } else if(d.step===2){
    body=`<h2 style="margin-bottom:4px">${kind==='delivery'?'Which reminder schedule do you want to test?':'Which version do you want to test?'}</h2>
    <p class="muted" style="margin-bottom:16px">${kind==='delivery'?'The course stays identical for everyone. Only the reminder changes.':'Learners get either the current course (A) or the new version (B), never both.'}</p>
    <div class="ab"><div class="abcard"><div class="k">A · CONTROL</div><div class="t">${controlName}</div><div class="small muted">What learners get today</div></div>
      <div class="abcard" style="border-color:var(--blue);background:#FAFAFF"><div class="k" style="color:var(--blue)">B · VARIANT</div><div class="t">${v.t}</div><div class="small muted">Selected below</div></div></div>
    ${vars.map(x=>`<label class="opt ${d.variant===x.id?'sel':''}"><input type="radio" name="variant" value="${x.id}" ${d.variant===x.id?'checked':''}><div><div class="t">${x.t}</div><div class="d">${x.d}</div></div></label>`).join('')}
    ${kind==='content'?`<div class="opt dis"><input type="radio" disabled><div><div class="t">Upload a new SCORM package</div><div class="d">In the real product: drag and drop a .zip. Not available in this prototype.</div></div></div>`:''}`;
  } else if(d.step===3){
    const warn=est.days>30;
    body=`<h2 style="margin-bottom:4px">Who takes part?</h2><p class="muted" style="margin-bottom:12px">Learners from the selected clients are split 50/50 at random. Each learner sees only one version.</p>
    ${d.errors.clients?`<div class="errmsg" style="margin-bottom:8px">${ic('warn',14)} ${d.errors.clients}</div>`:''}
    <div>${CLIENTS.map(k=>{const n=Math.round(c.learners*k.share);return `<label class="client ${k.optIn?'':'out'}">
      <input type="checkbox" data-client="${k.id}" ${k.optIn&&d.clients[k.id]?'checked':''} ${k.optIn?'':'disabled'}>
      <div><b>${k.name}</b><div class="small muted">${fmt(n)} learners in this course</div></div>
      ${k.optIn?'<span class="pill green">Opted in</span>':'<span class="pill gray">'+ic('lock',12)+' Opted out of experiments</span>'}
      <span></span></label>`}).join('')}</div>
    <div class="estimate">
      <div style="font-weight:700">Estimate</div>
      <div class="row2">
        <div><b>${fmt(est.learners)}</b><span>learners in audience</span></div>
        <div><b>${fmt(REQUIRED)}</b><span>needed (${REQUIRED/2} per group)</span></div>
        <div><b>${est.days?`~${est.days} days`:'—'}</b><span>to a reliable result</span></div>
      </div>
      <div class="small muted" style="margin-top:8px">Sized to detect a change of 10 points or more. Tests run at least ${MIN_DAYS} days to cover a full week.</div>
    </div>
    ${warn?`<div class="callout warn" style="margin-top:12px"><div class="ic">${ic('clock')}</div><div class="body"><b>This audience is small: about ${est.days} days to a result.</b><p>Add another client, or test a bigger change so it’s easier to detect. You can still launch.</p></div></div>`:''}`;
  } else {
    const m=METRICS[d.metric];
    body=`<h2 style="margin-bottom:12px">Review and launch</h2>
    <div class="hyp">If we <b>${esc(clean(d.change))}</b>, then <b>${m.label.toLowerCase()}</b> will improve, because ${esc(clean(d.why))}.</div>
    <dl class="summary" style="margin-top:16px">
      <dt>Course</dt><dd>${esc(c.title)}</dd>
      <dt>A · Control</dt><dd>${controlName}</dd>
      <dt>B · Variant</dt><dd>${v.t}</dd>
      <dt>Primary metric</dt><dd>${m.label}</dd>
      <dt>Guardrail</dt><dd>${GUARDS[d.guardrail].label} must not drop</dd>
      <dt>Audience</dt><dd>${est.sel.map(k=>k.name).join(', ')} · ${fmt(est.learners)} learners · 50/50 split</dd>
      <dt>Expected duration</dt><dd>~${est.days} days</dd>
    </dl>
    <div class="callout info" style="margin-top:16px"><div class="ic">${ic('info')}</div><div class="body"><b>No extra work for tech.</b><p>The experimentation tool assigns learners and Amplitude collects the results. Learners won’t notice anything different.</p></div></div>`;
  }
  return `
  <div class="crumbs"><a href="#/insights">Insights</a> / <a href="#/course/${c.id}">${esc(c.title)}</a> / <span>New experiment</span></div>
  <div class="page-head"><div><h1>${kind==='delivery'?'New delivery experiment':'New experiment'}</h1><p class="muted">${esc(c.title)}</p></div></div>
  <div class="stepper">${steps.map((s,i)=>`<div class="step ${i+1===d.step?'on':i+1<d.step?'done':''}"><span class="dot">${i+1<d.step?ic('check',12):i+1}</span>${s}</div>`).join('')}</div>
  <div class="card" style="max-width:760px">${body}
    <div class="wiz-foot">
      <button class="btn" data-act="back">${ic('left')} ${d.step===1?'Cancel':'Back'}</button>
      ${d.step<4?`<button class="btn primary" data-act="next">Next ${ic('right')}</button>`:`<button class="btn primary" data-act="launch">${ic('send')} Launch experiment</button>`}
    </div>
  </div>`;
}

/* ---------- results ---------- */
function viewExp(id){
  const e=S.experiments.find(x=>x.id===id); if(!e) return notFound();
  const c=course(e.courseId), m=METRICS[e.metric], g=GUARDS[e.guardrail];
  const midDay=Math.max(2,Math.ceil(e.days*.4)), finDay=e.days+1;
  const n=e.stage==='start'?Math.round(REQUIRED*.05):e.stage==='mid'?Math.round(REQUIRED*.41):REQUIRED+14;
  const day=e.stage==='start'?1:e.stage==='mid'?midDay:finDay;
  const vals=e.stage==='fin'?m.fin:m.mid;
  const fx=x=>m.dec?x.toFixed(m.dec):x;
  const lift=(vals[1]-vals[0]);
  const status=e.status==='rolled'?'<span class="pill green">'+ic('check',12)+' Winner rolled out</span>'
    :e.status==='kept'?'<span class="pill gray">Ended · current version kept</span>'
    :e.stage==='fin'?'<span class="pill green">Result ready</span>':'<span class="pill blue">'+ic('flask',12)+` Running · day ${day} of ~${e.days}</span>`;
  const bar=(name,sub,v,ci,col)=>`<div class="rb-row ${e.stage==='mid'?'faded':''}"><div class="nm">${name}<small>${sub}</small></div>
    <div class="rtrack"><div class="fill" style="width:${v/m.max*100}%;background:${col}"></div>
    <div class="ci" style="left:${Math.max(0,(v-ci)/m.max*100)}%;width:${Math.min(100,(2*ci)/m.max*100)}%"></div></div>
    <div class="v">${fx(v)}${m.unit==='/5'?'':m.unit.trim()==='pts'?'':m.unit}</div></div>`;
  let main='';
  if(e.stage==='start'){
    main=`<div class="empty"><div class="big">${ic('clock')}</div><h3 style="color:var(--ink)">Collecting data</h3><p style="margin-top:6px">${n} learners so far. Early trends appear after a few days, and the decision unlocks once ${fmt(REQUIRED)} learners have taken part.</p></div>`;
  } else {
    const ready=e.stage==='fin';
    main=`
    ${ready?`<div class="callout good"><div class="ic">${ic('check')}</div><div class="body"><b>B is better: +${fx(lift)}${m.unit==='%'?' points':m.unit==='/5'?'':' pts'} ${m.label.toLowerCase()}.</b><p>${vals[3]}% chance that B really is better (threshold: 95%). The guardrail held.</p></div></div>`
      :`<div class="callout warn"><div class="ic">${ic('warn')}</div><div class="body"><b>Not enough data yet. Don’t decide on these numbers.</b><p>Early results swing a lot. Right now there’s a ${vals[3]}% chance B is better, and we need 95%. The decision unlocks in about ${e.days-midDay+1} days.</p></div></div>`}
    <div style="margin-top:18px"><div class="small muted" style="font-weight:700;margin-bottom:8px">${m.label.toUpperCase()} <span style="font-weight:500">· bar = result, whiskers = uncertainty range</span></div>
    <div class="rbars">${bar('A · Control',e.controlName,vals[0],vals[2],'#B9B9CC')}${bar('B · Variant',e.variantName,vals[1],vals[2],ready?'var(--blue)':'#7F87E4')}</div></div>
    <div class="guard">${ready?`<span class="pill green">${ic('check',12)} Guardrail held</span>`:`<span class="pill gray">${ic('clock',12)} Guardrail: checking</span>`}
      <span><b>${g.label}:</b> A ${g.a} · B ${ready?g.b:'…'}</span></div>
    <div class="decision">
      ${e.status==='rolled'?`<span class="pill green" style="font-size:13px;padding:6px 12px">${ic('check',13)} Rolled out to all learners on ${esc(e.decidedOn)}</span><a class="btn sm" href="#/course/${c.id}">Back to course</a>`
       :e.status==='kept'?`<span class="pill gray" style="font-size:13px;padding:6px 12px">Current version kept on ${esc(e.decidedOn)}. Result saved to the idea log.</span>`
       :ready?`<button class="btn primary" data-act="rollout" data-arg="${e.id}">${ic('send')} Roll out B to all learners</button><button class="btn" data-act="keep" data-arg="${e.id}">Keep current version</button>`
       :`<button class="btn" disabled>${ic('lock')} Roll out B</button><button class="btn" disabled>${ic('lock')} Keep current</button><span class="small muted">Unlocks at ${fmt(REQUIRED)} learners</span>`}
    </div>`;
  }
  const canTravel=e.status==='running';
  return `
  <div class="crumbs"><a href="#/experiments">Experiments</a> / <span>${esc(e.name)}</span></div>
  <div class="page-head"><div><h1>${esc(e.name)}</h1><p class="muted"><a href="#/course/${c.id}">${esc(c.title)}</a></p></div><div>${status}</div></div>
  ${canTravel?`<div class="timebar"><span class="lbl">${ic('ff',14)} Prototype time travel</span>
    <div class="seg" role="group" aria-label="Simulate time">
      <button class="${e.stage==='start'?'on':''}" data-act="stage" data-arg="start">Day 1</button>
      <button class="${e.stage==='mid'?'on':''}" data-act="stage" data-arg="mid">Day ${midDay}</button>
      <button class="${e.stage==='fin'?'on':''}" data-act="stage" data-arg="fin">Day ${finDay}</button></div>
    <span class="small muted">Simulates the experiment over time</span></div>`:''}
  <div class="grid g2">
    <div class="card">
      <div class="card-head"><h2>Results</h2><span class="small muted">Amplitude · updated hourly</span></div>
      <div><div style="display:flex;justify-content:space-between;font-size:13px"><b>${fmt(Math.min(n,REQUIRED))} of ${fmt(REQUIRED)} learners</b><span class="muted">${e.stage==='fin'?'Target reached':`~${e.days-day+1} days left`}</span></div>
        <div class="progress"><span style="width:${Math.min(100,n/REQUIRED*100)}%"></span></div></div>
      ${main}
    </div>
    <div class="stack">
      <div class="card"><h2 style="margin-bottom:10px">Hypothesis</h2>
        <div class="hyp">If we <b>${esc(clean(e.change))}</b>, then <b>${m.label.toLowerCase()}</b> will improve, because ${esc(clean(e.why))}.</div></div>
      <div class="card"><h2 style="margin-bottom:12px">Setup</h2><div class="kv">
        <div><span>Audience</span>${e.clients.map(k=>CLIENTS.find(x=>x.id===k).name).join(', ')}</div>
        <div><span>Split</span>50% A · 50% B, assigned at random</div>
        <div><span>Guardrail</span>${g.label} must not drop</div>
        <div><span>Learner experience</span>Each learner sees one version only</div></div></div>
    </div>
  </div>`;
}

function viewExperiments(){
  const rows=S.experiments.slice().reverse();
  return `
  <div class="page-head"><div><h1>Experiments</h1><p class="muted">Every idea tested before it’s built.</p></div></div>
  <div class="card" style="margin-bottom:16px">
    <div class="tbl-wrap"><table>
      <thead><tr><th>Experiment</th><th>Course</th><th>Primary metric</th><th>Status</th><th>Result</th></tr></thead>
      <tbody>${rows.map(e=>{const m=METRICS[e.metric]; const st=e.status==='rolled'?'<span class="pill green">Winner rolled out</span>':e.status==='kept'?'<span class="pill gray">Current kept</span>':e.stage==='fin'?'<span class="pill green">Result ready</span>':'<span class="pill blue">Running</span>';
        const res=e.stage==='fin'?`+${m.dec?(m.fin[1]-m.fin[0]).toFixed(1):m.fin[1]-m.fin[0]}${m.unit==='%'?' pts':m.unit==='/5'?'':m.unit} · ${m.fin[3]}% confidence`:'<span class="muted">Collecting data</span>';
        return `<tr class="row" data-go="#/exp/${e.id}" tabindex="0"><td class="ctitle">${esc(e.name)}</td><td>${esc(course(e.courseId).title)}</td><td>${m.label}</td><td>${st}</td><td>${res}</td></tr>`}).join('')}</tbody>
    </table></div>
  </div>
  <div class="callout lock"><div class="ic">${ic('bulb')}</div><div class="body"><b>40+ stakeholder ideas are waiting.</b><p>Idea intake (Phase 2) will turn each one into a hypothesis like the ones above, so the team tests the most promising first.</p></div></div>`;
}
function notFound(){return `<div class="card empty"><h3 style="color:var(--ink)">Page not found</h3><p style="margin:6px 0 14px">This link doesn’t exist in the prototype.</p><a class="btn" href="#/insights">Back to Insights</a></div>`;}

/* ---------- modal ---------- */
function modal(){
  const md=S.modal;
  if(md.type==='rollout'){
    const e=S.experiments.find(x=>x.id===md.id), c=course(e.courseId);
    return `<div class="overlay" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" data-stop>
      <h3 id="mt">Roll out “${esc(e.variantName)}” to all learners?</h3>
      <p class="muted">${e.kind==='delivery'?'All clients will get the new reminder schedule from tomorrow.':`B replaces the current version of <b>${esc(c.title)}</b> for every client from tomorrow. Learners already in progress keep the version they started.`}</p>
      <div class="acts"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="confirmRollout" data-arg="${e.id}">${ic('send')} Roll out</button></div>
    </div></div>`;
  }
  if(md.type==='preview'){
    const chips=['Too long','Not relevant to my job','Too basic','Very useful'];
    return `<div class="overlay" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pt" data-stop>
      <h3 id="pt" style="display:flex;align-items:center">What learners see <button class="btn sm" style="margin-left:auto" data-act="closeModal" aria-label="Close">${ic('x')}</button></h3>
      <div class="lp"><div class="lp-top"><span>Data Storytelling for Managers</span><span>Module 1 of 4</span></div>
        <div class="lp-body">
          <div class="lp-check">${ic('check')}</div><h3>Module 1 done</h3>
          ${md.reason?`<p style="margin-top:12px;font-weight:600">Thanks, that helps us improve this course.</p>`:`
          <p class="muted" style="margin-top:8px">How useful was this module?</p>
          <div class="faces">${[1,2,3,4,5].map(n=>`<button class="${md.rating===n?'on':''}" data-act="rate" data-arg="${n}" aria-label="${n} out of 5">${n}</button>`).join('')}</div>
          <div class="scale-lbl"><span>Not useful</span><span>Very useful</span></div>
          ${md.rating?`<p class="muted small" style="margin-top:12px">Anything we should know? (optional)</p><div class="lp-chips">${chips.map(c=>`<button class="chip" data-act="reason" data-arg="${c}">${c}</button>`).join('')}</div>`:''}`}
          <div class="lp-actions"><button class="btn sm" data-act="closeModal">Skip</button><button class="btn primary sm" data-act="closeModal">Continue to Module 2 ${ic('right')}</button></div>
        </div></div>
      <p class="lp-note">One tap, optional, and it never blocks the learner. Sent to Amplitude as <code>module_rated</code>.</p>
    </div></div>`;
  }
  return '';
}

/* ---------- router & render ---------- */
function parse(){
  const h=(location.hash||'#/insights').slice(2); const [path,q]=h.split('?'); const parts=path.split('/');
  return {route:parts[0]||'insights',id:parts[1],q:new URLSearchParams(q||'')};
}
let lastRoute='';
function render(){
  const {route,id,q}=parse(); let html;
  if(route==='insights') html=viewInsights();
  else if(route==='course') html=viewCourse(id);
  else if(route==='new') html=viewNew(id,q.get('kind')||'content');
  else if(route==='exp') html=viewExp(id);
  else if(route==='experiments') html=viewExperiments();
  else html=notFound();
  document.getElementById('app').innerHTML=shell(route,html);
  const key=location.hash; if(key!==lastRoute){window.scrollTo(0,0); lastRoute=key;}
}
function toast(msg){
  const t=document.getElementById('toast'); t.innerHTML=ic('check')+' '+esc(msg); t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800);
}

const A={
  filter:a=>{S.filter=a;render();},
  guide:()=>{S.guide=true;render();},
  closeGuide:()=>{S.guide=false;render();},
  reset:()=>{S=seedState();S.guide=true;location.hash='#/insights';render();toast('Demo reset');},
  newExp:id=>{S.draft=null;location.hash='#/new/'+id;},
  newDelivery:id=>{S.draft=null;location.hash='#/new/'+id+'?kind=delivery';},
  next:()=>{const d=S.draft;d.errors=validate(d);if(Object.keys(d.errors).length){render();const el=document.querySelector('.err input,.err textarea,.errmsg');el&&el.focus&&el.focus();return;}d.step++;render();},
  back:()=>{const d=S.draft;if(d.step===1){location.hash='#/course/'+d.courseId;S.draft=null;return;}d.errors={};d.step--;render();},
  launch:()=>{
    const d=S.draft, est=estimate(d), v=VARIANTS[d.kind].find(x=>x.id===d.variant);
    const id='exp-'+(S.experiments.length+1);
    S.experiments.push({id,courseId:d.courseId,kind:d.kind,name:`${v.name} vs. current ${d.kind==='delivery'?'reminder':'version'}`,
      change:d.change,why:d.why,metric:d.metric,guardrail:d.guardrail,variantName:v.name,
      controlName:d.kind==='delivery'?'Monday 09:00':'v1 · Current course',clients:est.sel.map(k=>k.id),learners:est.learners,days:est.days,stage:'start',status:'running'});
    S.draft=null; location.hash='#/exp/'+id; toast('Experiment launched');
  },
  stage:a=>{const {id}=parse();const e=S.experiments.find(x=>x.id===id);e.stage=a;render();},
  rollout:id=>{S.modal={type:'rollout',id};render();},
  confirmRollout:id=>{const e=S.experiments.find(x=>x.id===id);e.status='rolled';e.decidedOn=today();S.modal=null;render();toast('Rolled out to all learners');},
  keep:id=>{const e=S.experiments.find(x=>x.id===id);e.status='kept';e.decidedOn=today();render();toast('Current version kept. Result saved.');},
  preview:()=>{S.modal={type:'preview'};render();},
  rate:n=>{S.modal.rating=+n;render();},
  reason:r=>{S.modal.reason=r;render();},
  closeModal:()=>{S.modal=null;render();}
};

document.addEventListener('click',ev=>{
  const stop=ev.target.closest('[data-stop]');
  const t=ev.target.closest('[data-act]');
  if(t && !(t.classList.contains('overlay') && stop)){ ev.preventDefault(); A[t.dataset.act]&&A[t.dataset.act](t.dataset.arg); return; }
  const row=ev.target.closest('[data-go]'); if(row && !ev.target.closest('a,button')) location.hash=row.dataset.go;
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'){const row=ev.target.closest&&ev.target.closest('[data-go]'); if(row){location.hash=row.dataset.go;}}
  if(ev.key==='Escape'&&S.modal){S.modal=null;render();}
});
document.addEventListener('input',ev=>{const f=ev.target.dataset&&ev.target.dataset.field; if(f&&S.draft&&ev.target.tagName!=='SELECT'){S.draft[f]=ev.target.value;}});
document.addEventListener('change',ev=>{
  const el=ev.target; if(!S.draft) return;
  if(el.tagName==='SELECT'&&el.dataset.field){S.draft[el.dataset.field]=el.value;render();}
  else if(el.name==='variant'){S.draft.variant=el.value;render();}
  else if(el.dataset.client){S.draft.clients[el.dataset.client]=el.checked; if(S.draft.errors.clients&&el.checked) delete S.draft.errors.clients; render();}
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
